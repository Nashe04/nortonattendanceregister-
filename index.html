<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norton Attendance Register</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F2F4F1;--surface:#fff;--surface2:#E8EDE9;--ink:#14221B;--muted:#586A5F;--line:#D3DCD5;--accent:#17694B;--accent-ink:#fff;--accent-soft:#D8EEE3;--warn:#9A5A00;--warn-bg:#FBEBCF;--bad:#A93428;--bad-bg:#F8DDD9;
--f-head:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1512;--surface:#16201B;--surface2:#1F2B25;--ink:#E5EEE8;--muted:#8FA398;--line:#2B3A32;--accent:#4DBB8E;--accent-ink:#08140E;--accent-soft:#153326;--warn:#E6A53B;--warn-bg:#3A2B10;--bad:#E5786B;--bad-bg:#3B1A16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1512;--surface:#16201B;--surface2:#1F2B25;--ink:#E5EEE8;--muted:#8FA398;--line:#2B3A32;--accent:#4DBB8E;--accent-ink:#08140E;--accent-soft:#153326;--warn:#E6A53B;--warn-bg:#3A2B10;--bad:#E5786B;--bad-bg:#3B1A16;color-scheme:dark}
html{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600}h1{font-size:30px;line-height:1.1}h2{font-size:20px}h3{font-size:16px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:500}.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.big{padding:16px 26px;font-size:18px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>.field{flex:1 1 160px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tot b{font-family:var(--f-head);font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}.tot small{color:var(--muted)}
.list{display:flex;flex-direction:column}
.w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.w:first-child{border-top:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px 2px 9px;font-size:13px;font-weight:500;background:var(--surface2);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.pill.in{background:var(--accent-soft);color:var(--accent)}.pill.late{background:var(--warn-bg);color:var(--warn)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}td.wrapok{white-space:normal;min-width:160px}
.note{background:var(--accent-soft);border-color:transparent}.note ul{margin:6px 0 0;padding-left:18px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:500}
.err{color:var(--bad)}.ok{color:var(--accent)}.flag{color:var(--warn)}
.kiosk{max-width:560px;margin:0 auto;width:100%;align-items:stretch;text-align:center}
.clock{font-family:var(--f-head);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kin{font-size:26px;text-align:center;padding:16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);width:100%}
.res{border-radius:14px;padding:18px;text-align:left}.res.good{background:var(--accent-soft);color:var(--accent)}.res.warn{background:var(--warn-bg);color:var(--warn)}.res.bad{background:var(--bad-bg);color:var(--bad)}
.res b{font-family:var(--f-head);font-size:26px;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;max-width:90vw}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);font-weight:500}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
</style>
</head>
<body><div class="wrap" id="app"></div><div id="toast"></div>
<script>
/* ===== SETTINGS: fill these to run in real time on several devices =====
   Leave empty to try the register on one browser only (demo mode). */
var SUPABASE_URL = "https://xsjwmqmdbrfpkhpnodsu.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_PPogPICjnAHv5dz-_G-MDw_sRzgGhUe";
/* ===================================================================== */
(function(){"use strict";
var SITE="Norton",MIN=60000,sb=null;
try{if(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){sb=null}
var REMOTE=!!sb;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function hhmm(ms){var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())}
function dkey(ms){var d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dkey(Date.now())}
function dur(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+"h "+pad(m%60)+"m"}
function hrs(m){return (Math.max(0,m)/60).toFixed(2)}
function rid(){return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=document.getElementById("toast");t.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';setTimeout(function(){t.innerHTML=""},3000)}
function tmin(s){var p=String(s).split(":");return +p[0]*60+ +p[1]}
var DEF={start:"08:00",end:"17:00",grace:5,brk:60,workdays:[1,2,3,4,5]};
var S={tab:"clock",user:null,auth:REMOTE?"checking":"local",authMsg:"",workers:[],punches:[],settings:DEF,
  from:dkey(Date.now()-13*86400000),to:today(),edit:null,msg:"",res:null,need:null,busy:false,loaded:false,ch:null};

/* ---------- local (demo) store: same rules as the database function ---------- */
var LD=(function(){try{return JSON.parse(localStorage.getItem("norton-att2"))}catch(e){return null}})()||{workers:[],punches:[],settings:DEF};
function lsave(){try{localStorage.setItem("norton-att2",JSON.stringify(LD))}catch(e){}}
function localPunch(no,reason){
  var w=LD.workers.filter(function(x){return x.active&&String(x.no).toLowerCase()===String(no).trim().toLowerCase()})[0];
  if(!w)return {status:"unknown"};
  var s=LD.settings,now=Date.now(),d=today(),sts=new Date(d+"T00:00:00").getTime()+tmin(s.start)*MIN,ets=new Date(d+"T00:00:00").getTime()+tmin(s.end)*MIN;
  var pu=LD.punches.filter(function(p){return p.worker_id===w.id&&p.day===d})[0];
  var dow=new Date().getDay();
  if(!pu){var late=s.workdays.indexOf(dow)>=0?Math.max(0,Math.floor((now-sts)/MIN)):0;
    if(late>s.grace&&!(reason||"").trim())return {status:"need_reason",name:w.name,late_min:late};
    if(late<=s.grace)late=0;
    LD.punches.push({id:rid(),worker_id:w.id,day:d,in_at:new Date(now).toISOString(),out_at:null,late_min:late,late_reason:late?reason.trim().slice(0,300):null,early_min:0});lsave();
    return {status:"in",name:w.name,late_min:late,at:now}}
  if(!pu.out_at){if(now-Date.parse(pu.in_at)<2*MIN)return {status:"duplicate",name:w.name,at:Date.parse(pu.in_at)};
    pu.out_at=new Date(now).toISOString();pu.early_min=Math.max(0,Math.floor((ets-now)/MIN));lsave();return {status:"out",name:w.name,early_min:pu.early_min,at:now,in_at:Date.parse(pu.in_at)}}
  return {status:"done",name:w.name,at:Date.parse(pu.out_at)};
}

/* ---------- data access ---------- */
function loadAll(){
  if(!REMOTE){S.workers=LD.workers;S.punches=LD.punches;S.settings=LD.settings;S.loaded=true;render();return Promise.resolve()}
  var from=new Date(Date.now()-800*86400000).toISOString().slice(0,10);
  return Promise.all([sb.from("att_workers").select("*").order("name"),sb.from("att_settings").select("*").eq("id",1).maybeSingle(),sb.from("att_punches").select("*").gte("day",from).order("day",{ascending:false}).limit(20000)]).then(function(r){
    if(r[0].error||r[2].error){S.msg=(r[0].error||r[2].error).message;S.loaded=true;render();return}
    S.workers=r[0].data||[];S.punches=r[2].data||[];var st=r[1].data;
    if(st)S.settings={start:String(st.start_time).slice(0,5),end:String(st.end_time).slice(0,5),grace:st.grace_min,brk:st.break_min,workdays:st.workdays};
    S.loaded=true;render();
  });
}
function subscribe(){if(!REMOTE||S.ch)return;S.ch=sb.channel("att").on("postgres_changes",{event:"*",schema:"public",table:"att_punches"},function(){if(adminOK()&&!typing())loadAll()}).subscribe()}
function typing(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT")&&a.id!=="kin"}
function adminOK(){return !REMOTE||S.auth==="in"}
function applySession(session){
  if(!session){S.auth="out";S.user=null;if(S.ch){try{sb.removeChannel(S.ch)}catch(e){}S.ch=null}S.workers=[];S.punches=[];render();return}
  S.user=session.user;
  sb.from("att_admins").select("user_id").eq("user_id",session.user.id).maybeSingle().then(function(r){
    if(r.error||!r.data){S.auth="denied";render();return}S.auth="in";loadAll().then(subscribe)});
}
function signIn(){var e=(document.getElementById("em").value||"").trim(),p=document.getElementById("pw").value||"";
  if(!e||!p){S.authMsg="Enter your email and password.";render();return}
  sb.auth.signInWithPassword({email:e,password:p}).then(function(r){if(r.error){S.authMsg=r.error.message;render();return}S.authMsg="";applySession(r.data.session)},function(){S.authMsg="Could not reach the server.";render()});
}
function doPunch(no,reason){
  if(S.busy)return;S.busy=true;
  var p=REMOTE?sb.rpc("att_punch",{p_no:no,p_reason:reason||null}).then(function(r){if(r.error)throw r.error;return r.data}):Promise.resolve(localPunch(no,reason));
  p.then(function(r){S.busy=false;
    if(r.status==="need_reason"){S.need={no:no,name:r.name,late:r.late_min};S.res=null}
    else{S.need=null;S.res=r;setTimeout(function(){if(S.res===r){S.res=null;render()}},9000);if(adminOK()&&S.loaded)loadAll()}
    render();var i=document.getElementById(S.need?"reason":"kin");if(i){i.value="";i.focus()}
  },function(e){S.busy=false;S.res={status:"error",msg:e.message||"Could not reach the server. Try again."};render()});
}

/* ---------- calculations ---------- */
function schedMin(){return Math.max(0,tmin(S.settings.end)-tmin(S.settings.start)-S.settings.brk)}
function workedMin(p){if(!p.out_at)return null;return Math.max(0,(Date.parse(p.out_at)-Date.parse(p.in_at))/MIN-S.settings.brk)}
function range(){var a=[],d=new Date(S.from+"T12:00:00"),e=new Date(S.to+"T12:00:00");for(var i=0;i<400&&d<=e;i++){a.push(dkey(d.getTime()));d.setDate(d.getDate()+1)}return a}
function isWork(day){return S.settings.workdays.indexOf(new Date(day+"T12:00:00").getDay())>=0}
function punchOf(wid,day){return S.punches.filter(function(p){return p.worker_id===wid&&p.day===day})[0]}
function summary(){
  var days=range(),sched=schedMin(),t=today();
  return S.workers.map(function(w){
    var o={w:w,workdays:0,present:0,absent:0,worked:0,notw:0,late:0,lateMin:0,open:0,ot:0};
    days.forEach(function(d){
      var wd=isWork(d),p=punchOf(w.id,d);
      if(wd&&d<=t)o.workdays+= (d<t||p?1:0);
      if(p){o.present++;if(p.late_min>0){o.late++;o.lateMin+=p.late_min}
        var wm=workedMin(p);
        if(wm==null){if(d<t)o.open++}
        else{o.worked+=wm;if(wd){o.notw+=Math.max(0,sched-wm);o.ot+=Math.max(0,wm-sched)}else o.ot+=wm}
      }else if(wd&&d<t){o.absent++;o.notw+=sched}
    });
    return o}).filter(function(o){return o.w.active||o.present});
}

/* ---------- views ---------- */
function render(){
  var y=window.scrollY,app=document.getElementById("app"),tabs=[["clock","Clock in or out"],["live","Today"],["reports","Reports"],["workers","Workers"],["settings","Settings"]];
  var h='<header class="top"><div><h1>'+esc(SITE)+' Attendance Register</h1><p class="muted" style="margin:4px 0 0">Fingerprint clock-in. Hours worked and not worked are worked out automatically.</p></div><div class="tabs" role="group" aria-label="View">'+tabs.map(function(t){return '<button data-act="tab" data-t="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div></header>';
  if(!REMOTE)h+='<div class="banner">Demo mode: records stay in this browser only. Connect Supabase for real-time use on several devices.</div>';
  if(S.tab==="clock")h+=vClock();
  else if(REMOTE&&S.auth!=="in")h+=vGate();
  else h+=S.tab==="live"?vLive():S.tab==="reports"?vReports():S.tab==="workers"?vWorkers():vSettings();
  app.innerHTML=h;window.scrollTo(0,y);
  if(S.tab==="clock"){var i=document.getElementById(S.need?"reason":"kin");if(i&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))i.focus()}
  tick();
}
function vGate(){
  if(S.auth==="checking")return '<div class="panel muted">Checking your sign-in…</div>';
  if(S.auth==="denied")return '<div class="panel"><h2>No access</h2><p class="muted" style="margin:0">'+esc(S.user&&S.user.email)+' is not on the administrator list.</p><div><button class="btn" data-act="signOut">Sign out</button></div></div>';
  return '<div class="panel" style="max-width:460px"><h2>Administrator sign-in</h2><div class="field"><label class="label" for="em">Email</label><input id="em" type="email" autocomplete="username"></div><div class="field"><label class="label" for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>'+(S.authMsg?'<div class="err">'+esc(S.authMsg)+'</div>':'')+'<div><button class="btn primary" data-act="signIn">Sign in</button></div></div>';
}
function vClock(){
  var h='<div class="panel kiosk"><div class="clock" data-live="clock">'+hhmm(Date.now())+'</div><div class="muted">'+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</div>';
  if(S.need){
    h+='<div class="res warn"><b>'+esc(S.need.name)+', you are '+dur(S.need.late)+' late</b>Please give the reason before you clock in.</div>'+
     '<div class="field" style="text-align:left"><label class="label" for="rsel">Reason</label><select id="rsel"><option>Transport problem</option><option>Sickness</option><option>Family emergency</option><option>Weather</option><option>Reported to another site first</option><option value="">Other (write below)</option></select></div>'+
     '<div class="field" style="text-align:left"><label class="label" for="reason">More detail (required if Other)</label><input id="reason" maxlength="200" autocomplete="off"></div><div class="row" style="justify-content:center"><button class="btn primary big" data-act="sendReason">Clock in</button><button class="btn quiet" data-act="cancelNeed">Cancel</button></div>';
  }else{
    h+='<input id="kin" class="kin" inputmode="numeric" autocomplete="off" placeholder="Place your finger on the scanner" aria-label="Worker number from fingerprint scanner"><div class="muted" style="font-size:13px">If the scanner is not working, type your worker number and press Enter.</div>';
    var r=S.res;if(r){
      if(r.status==="in")h+='<div class="res '+(r.late_min?"warn":"good")+'"><b>Welcome, '+esc(r.name)+'</b>Clocked in at '+hhmm(r.at)+(r.late_min?'. Late by '+dur(r.late_min)+'. Reason saved.':'. On time.')+'</div>';
      else if(r.status==="out")h+='<div class="res good"><b>Goodbye, '+esc(r.name)+'</b>Clocked out at '+hhmm(r.at)+'. Time worked today: '+dur(Math.max(0,(r.at-r.in_at)/MIN-S.settings.brk))+(r.early_min?'. Left '+dur(r.early_min)+' before end of shift.':'.')+'</div>';
      else if(r.status==="duplicate")h+='<div class="res warn"><b>'+esc(r.name)+'</b>You clocked in at '+hhmm(r.at)+'. Wait two minutes before clocking out.</div>';
      else if(r.status==="done")h+='<div class="res warn"><b>'+esc(r.name)+'</b>You already clocked out today at '+hhmm(r.at)+'. See the supervisor if this is wrong.</div>';
      else if(r.status==="unknown")h+='<div class="res bad"><b>Not recognised</b>That worker number is not registered. See the supervisor.</div>';
      else h+='<div class="res bad"><b>Problem</b>'+esc(r.msg)+'</div>';
    }
  }
  return h+'</div>';
}
function vLive(){
  var t=today(),sched=schedMin(),act=S.workers.filter(function(w){return w.active}),rows=[],inN=0,outN=0,late=0,wk=isWork(t),now=Date.now();
  act.forEach(function(w){var p=punchOf(w.id,t);if(p){if(p.out_at)outN++;else inN++;if(p.late_min>0)late++}rows.push({w:w,p:p})});
  var notIn=wk?act.length-inN-outN:0;
  var h='<div class="row" style="justify-content:space-between;align-items:center"><h2>Today, '+t+'</h2>'+(REMOTE?'<span class="live">Live</span>':'')+'</div>'+
   '<div class="totals"><div class="tot"><span class="label">On site now</span><b>'+inN+'</b><small>clocked in</small></div><div class="tot"><span class="label">Left for the day</span><b>'+outN+'</b><small>clocked out</small></div><div class="tot"><span class="label">Late today</span><b>'+late+'</b><small>reasons below</small></div><div class="tot"><span class="label">Not in yet</span><b>'+notIn+'</b><small>'+(wk?'of '+act.length+' workers':'not a working day')+'</small></div></div>';
  h+='<div class="panel"><div class="list">'+rows.map(function(x){var w=x.w,p=x.p,st,det="";
    if(!p)st='<span class="pill">Not in</span>';
    else{var inM=Date.parse(p.in_at);
      st=p.out_at?'<span class="pill">Out '+hhmm(Date.parse(p.out_at))+'</span>':'<span class="pill in">In since '+hhmm(inM)+'</span>';
      if(p.late_min>0)st+=' <span class="pill late">Late '+dur(p.late_min)+'</span>';
      var wm=p.out_at?workedMin(p):Math.max(0,(now-inM)/MIN-(now-inM>5*3600000?S.settings.brk:0));
      det='<div class="muted mono" style="font-size:13px;margin-top:4px">In '+hhmm(inM)+(p.out_at?' · out '+hhmm(Date.parse(p.out_at)):'')+' · worked '+dur(wm)+(p.out_at?' · not worked '+dur(Math.max(0,sched-wm)):'')+'</div>'+(p.late_reason?'<div style="margin-top:4px;font-size:13px"><span class="flag">Late reason:</span> '+esc(p.late_reason)+'</div>':'');}
    return '<div class="w"><div style="min-width:0"><b style="font-weight:500">'+esc(w.name)+'</b> <span class="muted mono">#'+esc(w.no)+'</span><div style="margin-top:4px">'+st+'</div>'+det+'</div></div>'}).join("")+(rows.length?'':'<div class="muted">No workers yet. Add them on the Workers tab.</div>')+'</div></div>';
  return h;
}
function vReports(){
  var sm=summary(),sched=schedMin(),h='<div class="panel"><div class="row"><div class="field"><label class="label" for="from">From</label><input type="date" id="from" value="'+S.from+'"></div><div class="field"><label class="label" for="to">To</label><input type="date" id="to" value="'+S.to+'"></div><div><button class="btn" data-act="csvSum">Export totals (CSV)</button> <button class="btn" data-act="csvDay">Export daily detail (CSV)</button></div></div></div>';
  h+='<div class="panel"><h2>Hours per worker</h2><div class="tablewrap"><table><thead><tr><th>Worker</th><th>Days present</th><th>Days absent</th><th>Hours worked</th><th>Hours not worked</th><th>Overtime</th><th>Times late</th><th>Minutes late</th><th>No clock-out</th></tr></thead><tbody>'+
   sm.map(function(o){return '<tr><td>'+esc(o.w.name)+' <span class="muted mono">#'+esc(o.w.no)+'</span></td><td class="mono">'+o.present+'</td><td class="mono'+(o.absent?' flag':'')+'">'+o.absent+'</td><td class="mono">'+hrs(o.worked)+'</td><td class="mono">'+hrs(o.notw)+'</td><td class="mono">'+hrs(o.ot)+'</td><td class="mono'+(o.late?' flag':'')+'">'+o.late+'</td><td class="mono">'+Math.round(o.lateMin)+'</td><td class="mono'+(o.open?' flag':'')+'">'+(o.open||"–")+'</td></tr>'}).join("")+(sm.length?'':'<tr><td colspan="9" class="muted">No workers yet.</td></tr>')+'</tbody></table></div>'+
   '<p class="muted" style="margin:0;font-size:13px">A full working day is '+hrs(sched)+' hours ('+S.settings.start+' to '+S.settings.end+', less a '+S.settings.brk+' minute break). Hours not worked = the part of that day not worked because of late arrival, early leaving or absence. Today is not counted as absent until the day ends.</p></div>';
  var recs=S.punches.filter(function(p){return p.day>=S.from&&p.day<=S.to}).sort(function(a,b){return a.day<b.day?1:a.day>b.day?-1:Date.parse(a.in_at)-Date.parse(b.in_at)});
  h+='<div class="panel"><h2>Daily detail</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Worker</th><th>In</th><th>Out</th><th>Worked</th><th>Not worked</th><th>Late</th><th>Late reason</th><th></th></tr></thead><tbody>'+
   recs.map(function(p){var w=S.workers.filter(function(x){return x.id===p.worker_id})[0];if(!w)return"";var wm=workedMin(p),wd=isWork(p.day);
    return '<tr><td class="mono">'+p.day+'</td><td>'+esc(w.name)+'</td><td class="mono">'+hhmm(Date.parse(p.in_at))+'</td><td class="mono">'+(p.out_at?hhmm(Date.parse(p.out_at)):'<span class="flag">missing</span>')+'</td><td class="mono">'+(wm==null?"–":dur(wm))+'</td><td class="mono">'+(wm==null?"–":dur(wd?Math.max(0,sched-wm):0))+'</td><td class="mono'+(p.late_min?' flag':'')+'">'+(p.late_min?dur(p.late_min):"–")+'</td><td class="wrapok">'+esc(p.late_reason||"")+'</td><td><button class="btn quiet" data-act="edit" data-id="'+p.id+'">Edit</button></td></tr>'+
     (S.edit===p.id?'<tr><td colspan="9"><div class="row" style="padding:8px 0"><div class="field"><label class="label" for="ein">In</label><input type="datetime-local" id="ein" value="'+lt(p.in_at)+'"></div><div class="field"><label class="label" for="eout">Out</label><input type="datetime-local" id="eout" value="'+lt(p.out_at)+'"></div><div class="field"><label class="label" for="ere">Late reason</label><input id="ere" value="'+esc(p.late_reason||"")+'"></div><div><button class="btn primary" data-act="saveEdit" data-id="'+p.id+'">Save</button> <button class="btn quiet" data-act="edit" data-id="">Cancel</button></div></div></td></tr>':'')}).join("")+(recs.length?'':'<tr><td colspan="9" class="muted">No records in this range.</td></tr>')+'</tbody></table></div></div>';
  return h;
}
function lt(iso){if(!iso)return"";var d=new Date(Date.parse(iso));return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function vWorkers(){
  var h='<div class="panel"><h2>Add a worker</h2><p class="muted" style="margin:0">The worker number must be the number enrolled on the fingerprint scanner for this person.</p><div class="row"><div class="field"><label class="label" for="wn">Full name</label><input id="wn" autocomplete="off"></div><div class="field"><label class="label" for="wno">Worker number</label><input id="wno" inputmode="numeric"></div><div class="field"><label class="label" for="wr">Role (optional)</label><input id="wr"></div><div><button class="btn primary" data-act="addW">Add</button></div></div>'+(S.msg?'<div class="err">'+esc(S.msg)+'</div>':'')+'</div>';
  h+='<div class="panel"><h2>Workers ('+S.workers.length+')</h2><div class="list">'+S.workers.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(w){return '<div class="w"><div><b style="font-weight:500">'+esc(w.name)+'</b> <span class="muted mono">#'+esc(w.no)+'</span>'+(w.role?'<div class="muted" style="font-size:13px">'+esc(w.role)+'</div>':'')+(w.active?'':' <span class="pill">Inactive</span>')+'</div><button class="btn quiet" data-act="toggleW" data-id="'+w.id+'">'+(w.active?"Make inactive":"Reactivate")+'</button></div>'}).join("")+(S.workers.length?'':'<div class="muted">No workers yet.</div>')+'</div></div>';
  return h;
}
function vSettings(){
  var s=S.settings,dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return '<div class="panel"><h2>Working hours</h2><div class="row"><div class="field"><label class="label" for="sst">Shift starts</label><input type="time" id="sst" value="'+s.start+'"></div><div class="field"><label class="label" for="sen">Shift ends</label><input type="time" id="sen" value="'+s.end+'"></div><div class="field"><label class="label" for="sgr">Grace minutes before counted late</label><input type="number" id="sgr" min="0" value="'+s.grace+'"></div><div class="field"><label class="label" for="sbr">Unpaid break (minutes)</label><input type="number" id="sbr" min="0" value="'+s.brk+'"></div></div>'+
   '<div><div class="label" style="margin-bottom:6px">Working days</div><div class="row" style="gap:14px">'+dn.map(function(n,i){return '<label><input type="checkbox" class="wd" value="'+i+'"'+(s.workdays.indexOf(i)>=0?" checked":"")+'> '+n+'</label>'}).join("")+'</div></div><div><button class="btn primary" data-act="saveSet">Save settings</button></div>'+(S.msg?'<div class="ok">'+esc(S.msg)+'</div>':'')+'</div>'+
   '<div class="panel note"><h3>Privacy</h3><ul><li>Fingerprints stay on the scanner. This system stores only names, worker numbers and times.</li><li>Get each worker\'s written consent before enrolling a fingerprint.</li><li>Remove a worker from the scanner when they leave.</li></ul></div>'+(REMOTE?'<div><button class="btn quiet" data-act="signOut">Sign out</button></div>':'');
}
function tick(){var el=document.querySelector("[data-live=clock]");if(el)el.textContent=hhmm(Date.now())}
setInterval(tick,5000);
setInterval(function(){if(S.tab==="live"&&!document.hidden&&!typing()&&adminOK()&&S.loaded)render()},60000);

/* ---------- actions ---------- */
function dl(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function cc(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csv(rows){return "﻿"+rows.map(function(r){return r.map(cc).join(",")}).join("\n")}
function saveW(w){if(!REMOTE){var i=LD.workers.findIndex(function(x){return x.id===w.id});if(i<0)LD.workers.push(w);else LD.workers[i]=w;lsave();S.workers=LD.workers;render();return}
  var q=w._new?sb.from("att_workers").insert({no:w.no,name:w.name,role:w.role||null,active:true}):sb.from("att_workers").update({active:w.active}).eq("id",w.id);
  q.then(function(r){if(r.error){S.msg=/duplicate/.test(r.error.message)?"That worker number is already used.":r.error.message;render()}else{S.msg="";loadAll()}})}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");
  if(a==="tab"){S.tab=b.getAttribute("data-t");S.msg="";S.edit=null;render()}
  else if(a==="signIn")signIn();
  else if(a==="signOut"){sb.auth.signOut().then(function(){applySession(null)})}
  else if(a==="sendReason"){var sel=document.getElementById("rsel").value,tx=document.getElementById("reason").value.trim();
    if(!sel&&!tx){toast("Please write the reason.");return}doPunch(S.need.no,(sel?sel+(tx?": "+tx:""):tx))}
  else if(a==="cancelNeed"){S.need=null;render()}
  else if(a==="addW"){var n=document.getElementById("wn").value.trim(),no=document.getElementById("wno").value.trim(),r=document.getElementById("wr").value.trim();
    if(!n||!no){S.msg="Enter a name and a worker number.";render();return}
    if(S.workers.some(function(w){return String(w.no).toLowerCase()===no.toLowerCase()})){S.msg="Worker number "+no+" is already used.";render();return}
    S.msg="";saveW({id:rid(),no:no.slice(0,20),name:n.slice(0,80),role:r.slice(0,60),active:true,_new:true})}
  else if(a==="toggleW"){var w=S.workers.filter(function(x){return x.id===b.getAttribute("data-id")})[0];w.active=!w.active;saveW(w)}
  else if(a==="saveSet"){var ns={start:document.getElementById("sst").value||"08:00",end:document.getElementById("sen").value||"17:00",grace:+document.getElementById("sgr").value||0,brk:+document.getElementById("sbr").value||0,workdays:[].slice.call(document.querySelectorAll(".wd:checked")).map(function(c){return +c.value})};
    if(tmin(ns.end)<=tmin(ns.start)){S.msg="";toast("Shift end must be after shift start.");return}
    S.settings=ns;
    if(!REMOTE){LD.settings=ns;lsave();S.msg="Saved.";render()}
    else sb.from("att_settings").update({start_time:ns.start,end_time:ns.end,grace_min:ns.grace,break_min:ns.brk,workdays:ns.workdays}).eq("id",1).then(function(r){S.msg=r.error?r.error.message:"Saved.";render()})}
  else if(a==="edit"){S.edit=b.getAttribute("data-id")||null;render()}
  else if(a==="saveEdit"){var id=b.getAttribute("data-id"),iv=document.getElementById("ein").value,ov=document.getElementById("eout").value,rs=document.getElementById("ere").value.trim();
    if(!iv){toast("Clock-in time is required.");return}var inI=new Date(iv).toISOString(),outI=ov?new Date(ov).toISOString():null;
    if(outI&&outI<inI){toast("Clock-out must be after clock-in.");return}
    var ets=new Date(iv.slice(0,10)+"T00:00:00").getTime()+tmin(S.settings.end)*MIN,sts=new Date(iv.slice(0,10)+"T00:00:00").getTime()+tmin(S.settings.start)*MIN;
    var late=Math.max(0,Math.floor((Date.parse(inI)-sts)/MIN));if(late<=S.settings.grace)late=0;var early=outI?Math.max(0,Math.floor((ets-Date.parse(outI))/MIN)):0;
    var patch={in_at:inI,out_at:outI,late_min:late,late_reason:late?(rs||"Edited by administrator"):null,early_min:early};
    if(!REMOTE){var p=LD.punches.filter(function(x){return x.id===id})[0];Object.assign(p,patch);lsave();S.edit=null;render()}
    else sb.from("att_punches").update(patch).eq("id",id).then(function(r){if(r.error)toast(r.error.message);else{S.edit=null;loadAll()}})}
  else if(a==="csvSum"){dl("attendance-totals-"+S.from+"_to_"+S.to+".csv",csv([["Worker","Number","Days present","Days absent","Hours worked","Hours not worked","Overtime hours","Times late","Minutes late","Days without clock-out"]].concat(summary().map(function(o){return[o.w.name,o.w.no,o.present,o.absent,hrs(o.worked),hrs(o.notw),hrs(o.ot),o.late,Math.round(o.lateMin),o.open]}))))}
  else if(a==="csvDay"){var sched=schedMin(),rows=[["Date","Worker","Number","In","Out","Hours worked","Hours not worked","Minutes late","Late reason"]];
    S.punches.filter(function(p){return p.day>=S.from&&p.day<=S.to}).sort(function(a,b){return a.day<b.day?-1:1}).forEach(function(p){var w=S.workers.filter(function(x){return x.id===p.worker_id})[0];if(!w)return;var wm=workedMin(p);rows.push([p.day,w.name,w.no,hhmm(Date.parse(p.in_at)),p.out_at?hhmm(Date.parse(p.out_at)):"",wm==null?"":hrs(wm),wm==null?"":hrs(isWork(p.day)?Math.max(0,sched-wm):0),p.late_min,p.late_reason||""])});
    dl("attendance-daily-"+S.from+"_to_"+S.to+".csv",csv(rows))}
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter")return;var t=ev.target;
  if(t.id==="kin"){var v=t.value.trim();if(v)doPunch(v,null)}
  else if(t.id==="reason"){document.querySelector("[data-act=sendReason]").click()}
  else if(t.id==="pw"||t.id==="em")signIn();
});
document.addEventListener("change",function(ev){var t=ev.target;if((t.id==="from"||t.id==="to")&&t.value){S[t.id]=t.value;render()}});
render();
if(REMOTE){sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s)applySession(s);else{S.auth="out";render()}},function(){S.auth="out";render()})}
else loadAll();
})();
</script>
</body></html>
